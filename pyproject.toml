[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-tweeks"
version = "0.1.6"
description = "Phantom Tweeks — advanced Windows gaming and performance optimization suite."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "Phantom Tweeks"}]
keywords = ["windows", "gaming", "performance", "optimization", "benchmarking"]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
build = ["pyinstaller>=6.3", "pillow>=10.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
phantomtweeks = "phantom_tweeks.cli.main:run"

[project.gui-scripts]
PhantomTweeks = "phantom_tweeks.gui.app_window:launch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "repo_hygiene: asserts repository/CI configuration rather than shipped code. Deselected by build.ps1 so a stale CI file cannot block a release build.",
]
testpaths = ["tests"]
addopts = "-q"
